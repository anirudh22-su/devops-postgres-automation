---
# STOP PostgreSQL
- name: Stop PostgreSQL
  service:
    name: postgresql
    state: stopped
    enabled: yes

# CLEAN data
- name: Remove old data
  file:
    path: /var/lib/postgresql/14/main
    state: absent

# RECREATE directory
- name: Recreate PG data directory
  file:
    path: /var/lib/postgresql/14/main
    state: directory
    owner: postgres
    group: postgres
    mode: '0700'

# RUN BASEBACKUP
- name: Run base backup from primary
  become_user: postgres
  shell: >
    PGPASSWORD="StrongPass123"
    pg_basebackup -h {{ hostvars['primary']['ansible_host'] }}
    -D /var/lib/postgresql/14/main
    -U replicator -Fp -Xs -P -R
  environment:
    PGPASSWORD: "StrongPass123"

# FIX OWNERSHIP
- name: Ensure correct ownership
  file:
    path: /var/lib/postgresql/14/main
    owner: postgres
    group: postgres
    recurse: yes

# VALIDATE standby.signal
- name: Verify standby.signal was created
  stat:
    path: /var/lib/postgresql/14/main/standby.signal
  register: standby_signal

- name: Fail if standby.signal missing
  fail:
    msg: "Replica not initialized correctly: standby.signal missing!"
  when: not standby_signal.stat.exists

# START POSTGRESQL
- name: Start PostgreSQL service
  service:
    name: postgresql
    state: started
    enabled: yes

